<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        var baseUrl = window.location.port === '8000' ? '' : 'http://localhost:8000';
        document.write('<link rel="stylesheet" href="' + baseUrl + '/css/styles.css">');
    </script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-tasks me-2"></i>Task Manager
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4" id="dashboard">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-list me-2"></i>Total</h5>
                        <h2 id="stat-total">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-dark">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-clock me-2"></i>Pending</h5>
                        <h2 id="stat-pending">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-check-circle me-2"></i>Completed</h5>
                        <h2 id="stat-done">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-danger text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-exclamation-triangle me-2"></i>Overdue</h5>
                        <h2 id="stat-overdue">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="openAddModal()">
                    <i class="fas fa-plus me-2"></i>Add Task
                </button>
            </div>
            <div class="col-md-6">
                <div class="row g-2">
                    <div class="col-4">
                        <select class="form-select" id="filter-status">
                            <option value="all">All Status</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Done">Done</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <select class="form-select" id="filter-priority">
                            <option value="all">All Priority</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <select class="form-select" id="sort-by">
                            <option value="">Sort By</option>
                            <option value="due_date_asc">Due Date (Earliest)</option>
                            <option value="due_date_desc">Due Date (Latest)</option>
                            <option value="priority_high">Priority (High First)</option>
                            <option value="priority_low">Priority (Low First)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" class="form-control" id="search-input" placeholder="Search by title...">
                    <button class="btn btn-outline-secondary" type="button" onclick="loadTasks()">Search</button>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped" id="task-table">
                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    <tr><td colspan="6" class="text-center">Loading tasks...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalLabel">Add Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="task-form" novalidate>
                    <div class="modal-body">
                        <input type="hidden" id="task-id">
                        <div class="mb-3">
                            <label for="task-title" class="form-label">Title *</label>
                            <input type="text" class="form-control" id="task-title" required maxlength="100">
                            <div class="invalid-feedback" id="title-error"></div>
                        </div>
                        <div class="mb-3">
                            <label for="task-description" class="form-label">Description</label>
                            <textarea class="form-control" id="task-description" rows="3" maxlength="500"></textarea>
                            <div class="invalid-feedback" id="desc-error"></div>
                        </div>
                        <div class="mb-3">
                            <label for="task-due-date" class="form-label">Due Date *</label>
                            <input type="date" class="form-control" id="task-due-date" required>
                            <div class="invalid-feedback" id="due-date-error"></div>
                            <small class="text-muted" id="date-hint">Select a future date</small>
                        </div>
                        <div class="mb-3">
                            <label for="task-status" class="form-label">Status</label>
                            <select class="form-select" id="task-status">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                            <div class="invalid-feedback" id="status-error"></div>
                        </div>
                        <div class="mb-3">
                            <label for="task-priority" class="form-label">Priority *</label>
                            <select class="form-select" id="task-priority" required>
                                <option value="">Select Priority</option>
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>
                            <div class="invalid-feedback" id="priority-error"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this task? This action cannot be undone.</p>
                    <input type="hidden" id="delete-task-id">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var baseUrl = window.location.port === '8000' ? '' : 'http://localhost:8000';
        document.write('<script src="' + baseUrl + '/js/app.js"><\/script>');
    </script>
</body>
</html>
